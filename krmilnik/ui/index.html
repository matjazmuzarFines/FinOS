<!doctype html>
<html lang="sl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FIN:OS krmilnik</title>
    <link rel="stylesheet" href="krmilnik.css" />
    <link rel="stylesheet" href="finesek.css" />
  </head>
  <body>
    <div class="okvir">
      <header class="glava">
        <span class="znak">FIN<span class="pike"><i></i><i></i></span><b>OS</b></span>
        <span class="naprava" id="naprava">Krmilnik</span>
        <span class="zveza" id="zveza"><i></i><span>Povezujem ...</span></span>
      </header>

      <main class="vsebina">
        <section class="zaslon">
          <div class="datum" id="datum"></div>
          <div class="ura"><span id="ure">--</span><span class="dvopicje">:</span><span id="minute">--</span><small id="sekunde">--</small></div>
          <div class="sporocilo" id="sporocilo">
            <span class="kartica"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span>
            <span id="sporocilo-besedilo">Prisloni kartico</span>
          </div>
        </section>
        <section class="tipke" id="tipke"></section>
      </main>
    </div>

    <!-- potrdilo žiga čez cel zaslon -->
    <div class="potrdilo" id="potrdilo" hidden>
      <div class="potrdilo-kartica" id="potrdilo-kartica">
        <!-- Finesek v kotu potrdila: maha (prihod), malica (sedi in je), odhod (pomaha in odide) - krmilnik.js fineskovPrizor -->
        <div class="fz" id="finesek" hidden aria-hidden="true">
          <div class="fz-platno">
            <div class="fz-odeja"></div>
            <div class="fz-senca"></div>
            <div class="fz-lik">
              <div class="fz-spredaj">
                <div class="fz-del fz-noga-l"><img src="finesek/noga-leva.webp" alt="" /></div>
                <div class="fz-del fz-noga-d"><img src="finesek/noga-desna.webp" alt="" /></div>
                <div class="fz-del fz-roka-l"><img src="finesek/roka-leva.webp" alt="" /></div>
                <div class="fz-del fz-roka-d"><img src="finesek/roka-desna.webp" alt="" /></div>
                <img class="fz-telo" src="finesek/telo-spredaj.webp" alt="" />
                <div class="fz-hrana" id="finesek-hrana"></div>
                <div class="fz-drobtine"><i></i><i></i><i></i></div>
              </div>
              <div class="fz-stran">
                <div class="fz-del fz-snoga-z"><img src="finesek/noga-desna.webp" alt="" /></div>
                <div class="fz-del fz-snoga-s"><img src="finesek/noga-desna.webp" alt="" /></div>
                <img class="fz-telo-stran" src="finesek/telo-stran.webp" alt="" />
                <div class="fz-del fz-sroka"><img src="finesek/roka-desna.webp" alt="" /></div>
              </div>
            </div>
          </div>
        </div>
        <div class="potrdilo-ikona" id="potrdilo-ikona"></div>
        <div class="potrdilo-naslov" id="potrdilo-naslov"></div>
        <div class="potrdilo-opis" id="potrdilo-opis"></div>
        <ul class="potrdilo-seznam" id="potrdilo-seznam"></ul>
      </div>
    </div>

    <script src="krmilnik.js"></script>
  </body>
</html>
